<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Compressarr - Lanes</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#5b6389" />
  <link rel="apple-touch-icon" href="/assets/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Compressarr" />
  <script>document.documentElement.setAttribute('data-theme', localStorage.getItem('compressarr.theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h2 class="page-title">Lanes</h2>
    <div class="page-actions">
      <button id="saveAllLanesBtn" class="primary" title="Save all lanes"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>Save all</button>
      <button id="clearChangesBtn" title="Discard unsaved changes and reload the saved lanes"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>Clear changes</button>
      <span class="tb-sep"></span>
      <button id="addLaneBtn" title="Add a new lane"><svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>Add lane</button>
    </div>
    <div id="lanes"></div>
  </main>

  <template id="lane-template">
    <div class="lane-card" data-id="">
      <div class="lane-head">
        <label class="lane-switch" title="Whether this lane is included when a run or monitoring pass scans for files.">
          <input type="checkbox" class="f-enabled" />
          <span class="knob"></span>
        </label>
        <input type="text" class="f-displayName lane-name-input" placeholder="Lane name" />
        <div class="lane-head-spacer"></div>
        <div class="lane-head-actions">
          <button class="save-lane-btn icon-btn save">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save
          </button>
          <button class="duplicate-lane-btn icon-btn" title="Copy this lane under a new name">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            Duplicate
          </button>
          <button class="remove-lane-btn icon-btn remove">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
            Remove
          </button>
        </div>
      </div>

      <div class="lane-body">
        <div class="folders-grid">
          <div class="field-block">
            <label>Input<span class="help-tag" tabindex="0" title="Folder Compressarr scans for video files to convert.">?<span class="help-tip">Folder Compressarr scans for video files to convert.</span></span></label>
            <div class="field-with-btn">
              <input type="text" class="f-input" />
              <button class="browse-btn" data-target="f-input">Browse...</button>
            </div>
            <div class="field-note f-inputNote hidden"></div>
          </div>
          <div class="field-block">
            <label>Output<span class="help-tag" tabindex="0" title="Folder converted files are written to, unless &quot;Write output to same folder as input&quot; is enabled in Settings.">?<span class="help-tip">Folder converted files are written to, unless "Write output to same folder as input" is enabled in Settings.</span></span></label>
            <div class="field-with-btn">
              <input type="text" class="f-output" />
              <button class="browse-btn" data-target="f-output">Browse...</button>
            </div>
          </div>
        </div>

        <div class="field-block lane-encoder">
          <label>Encoder<span class="help-tag" tabindex="0" title="Which tool encodes this lane's files. The profiles below are that tool's own - HandBrake's or ffmpeg's. ffmpeg is experimental; set it up on the Encoder page.">?<span class="help-tip">Which tool encodes this lane's files. The profiles below are that tool's own - HandBrake's or ffmpeg's. ffmpeg is experimental; set it up on the Encoder page.</span></span></label>
          <select class="f-engine"><option value="HandBrake">HandBrake</option><option value="FFmpeg">ffmpeg (Experimental)</option></select>
          <div class="lane-encoder-note f-engineNote hidden"></div>
        </div>

        <div class="field-block adv-only">
          <div class="check-row"><input type="checkbox" class="f-allowHdrLoss" /><label>Allow HDR files to lose their HDR<span class="help-tag" tabindex="0" title="Normally an HDR, Dolby Vision or HDR10+ file is NOT encoded with a profile that would lose the HDR (an SDR-only H.264 profile, or a hardware encoder that can't keep Dolby Vision / HDR10+): it is left alone and reported as ERROR 114, so the original is never replaced by a washed-out copy. Tick this to encode them anyway. A Dolby Vision profile 5 file is always refused (it would show wrong colours). For ffmpeg lanes, the same choice is on the ffmpeg profile.">?<span class="help-tip">Normally an HDR, Dolby Vision or HDR10+ file is NOT encoded with a profile that would lose the HDR (an SDR-only H.264 profile, or a hardware encoder that can't keep Dolby Vision / HDR10+): it is left alone and reported as ERROR 114, so the original is never replaced by a washed-out copy. Tick this to encode them anyway. A Dolby Vision profile 5 file is always refused (it would show wrong colours). For ffmpeg lanes, the same choice is on the ffmpeg profile.</span></span></label></div>
        </div>
        <div class="lane-encoder-note f-hdrLossNote adv-off-only hidden">HDR files may lose their HDR on this lane.</div>

        <div class="routing-heading">Content routing</div>
        <div class="routing-grid">
          <div class="routing-col">
            <div class="routing-col-head">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect><line x1="7" y1="2" x2="7" y2="22"></line><line x1="17" y1="2" x2="17" y2="22"></line><line x1="2" y1="12" x2="22" y2="12"></line><line x1="2" y1="7" x2="7" y2="7"></line><line x1="2" y1="17" x2="7" y2="17"></line><line x1="17" y1="17" x2="22" y2="17"></line><line x1="17" y1="7" x2="22" y2="7"></line></svg>
              Movie
            </div>
            <div class="field-block">
              <label>Profile<span class="help-tag" tabindex="0" title="Encoding profile used for files detected as movies (from this lane's encoder - see the Profiles page). Choose Passthrough (no re-encode) to copy the file instead of re-encoding it: everything else (filing, renaming, cleanup) still happens.">?<span class="help-tip">Encoding profile used for files detected as movies (from this lane's encoder - see the Profiles page). Choose Passthrough (no re-encode) to copy the file instead of re-encoding it: everything else (filing, renaming, cleanup) still happens.</span></span></label>
              <select class="f-moviePreset"></select>
            </div>
            <div class="field-block">
              <label>Destination path<span class="help-tag" tabindex="0" title="Destination folder converted movies are moved into, if Move converted files is enabled in Settings.">?<span class="help-tip">Destination folder converted movies are moved into, if Move converted files is enabled in Settings.</span></span></label>
              <div class="field-with-btn">
                <input type="text" class="f-movieBasePath" />
                <button class="browse-btn" data-target="f-movieBasePath">Browse...</button>
              </div>
            </div>
          </div>
          <div class="routing-col">
            <div class="routing-col-head">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
              TV
            </div>
            <div class="field-block">
              <label>Profile<span class="help-tag" tabindex="0" title="Encoding profile used for files detected as TV episodes (from this lane's encoder - see the Profiles page). Choose Passthrough (no re-encode) to copy the file instead of re-encoding it: everything else (filing, renaming, cleanup) still happens.">?<span class="help-tip">Encoding profile used for files detected as TV episodes (from this lane's encoder - see the Profiles page). Choose Passthrough (no re-encode) to copy the file instead of re-encoding it: everything else (filing, renaming, cleanup) still happens.</span></span></label>
              <select class="f-tvPreset"></select>
            </div>
            <div class="field-block">
              <label>Destination path<span class="help-tag" tabindex="0" title="Destination folder converted TV episodes are moved into, if Move converted files is enabled in Settings.">?<span class="help-tip">Destination folder converted TV episodes are moved into, if Move converted files is enabled in Settings.</span></span></label>
              <div class="field-with-btn">
                <input type="text" class="f-tvShowBasePath" />
                <button class="browse-btn" data-target="f-tvShowBasePath">Browse...</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="/nav.js"></script>
  <script src="/browse.js"></script>
  <script src="/lanes.js"></script>
</body>
</html>
